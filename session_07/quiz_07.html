<!--
Quiz page for C Language Session 7 (문자열과 포인터).
8 multiple-choice questions, instant feedback, final score. Cyan & Amber palette to match C_NN.html decks.
NEITHER Mermaid JS NOR SVG were used anywhere in this output.
-->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7차시 퀴즈: 문자열과 포인터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap");
      body { font-family: "Pretendard", sans-serif; background-color: #0f172a; color: #f8fafc; }
      pre, code { font-family: 'Courier New', Courier, monospace; }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <span class="bg-cyan-600 text-white text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">Quiz 7</span>
        <h1 class="text-sm md:text-base font-bold text-slate-200">7차시 퀴즈 — 문자열과 포인터</h1>
      </div>
      <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
        <span class="text-xs text-slate-400">진행:</span>
        <span id="progress" class="text-xs font-bold text-cyan-400">0 / 15</span>
      </div>
    </div>

    <div class="max-w-3xl mx-auto p-4 md:p-8">
      <div id="intro" class="bg-slate-900 rounded-3xl p-8 border border-slate-800 mb-6">
        <h2 class="text-2xl font-black text-white mb-2">수업 마무리 퀴즈</h2>
        <p class="text-slate-400 text-sm mb-4">문자열 구조, 포인터 순회, 대소문자 변환을 점검합니다. 총 15문항. 각 문항은 답을 고르면 바로 정답·해설이 표시됩니다.</p>
        <button onclick="startQuiz()" class="bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors">퀴즈 시작</button>
      </div>
      <div id="quizArea" class="hidden space-y-4"></div>
      <div id="result" class="hidden bg-slate-900 rounded-3xl p-8 border border-slate-800 text-center mt-6">
        <h2 class="text-2xl font-black text-white mb-2">결과</h2>
        <p id="scoreText" class="text-4xl font-black mb-3"></p>
        <p id="scoreMsg" class="text-slate-400 text-sm mb-5"></p>
        <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold px-5 py-2.5 rounded-lg border border-slate-700 transition-colors">다시 풀기</button>
      </div>
    </div>

    <script>
      const QUESTIONS = [
        {
          q: 'C 문자열 <code class="text-cyan-300">"hello"</code>를 담으려면 char 배열의 최소 크기는?',
          opts: ["4", "5", "6", "7"],
          answer: 2,
          why: '글자 5개 + null terminator(\\0) 1칸 = 6바이트. \\0이 끝을 표시합니다.'
        },
        {
          q: "문자열의 끝을 표시하는 것은?",
          opts: ["공백 ' '", "숫자 '0'", "null terminator '\\0'", "줄바꿈 '\\n'"],
          answer: 2,
          why: "'\\0'은 값이 0인 한 바이트. 숫자 '0'(아스키 48)이나 공백과 다릅니다."
        },
        {
          q: '다음 중 <span class="text-rose-300">수정하면 위험한</span>(크래시) 선언은?',
          opts: ['char arr[] = "hi";', 'char *ptr = "hi";', "char arr[3];", "char c = 'A';"],
          answer: 1,
          why: '문자열 리터럴을 가리키는 char *ptr는 읽기 전용 메모리를 가리킵니다. 수정하려면 char arr[]를 쓰세요.'
        },
        {
          q: '<code class="text-cyan-300">while (*p)</code> 반복이 멈추는 시점은?',
          opts: ["p가 NULL일 때", "*p가 '\\0'(0)일 때", "p가 배열 끝을 넘을 때", "10번 반복 후"],
          answer: 1,
          why: "*p가 '\\0'이면 값이 0(거짓)이라 while이 종료됩니다. 길이를 몰라도 끝까지 순회합니다."
        },
        {
          q: "문자 'a'를 대문자 'A'로 바꾸려면?",
          opts: ["'a' + 32", "'a' - 32", "'a' * 2", "'a' + 1"],
          answer: 1,
          why: "소문자와 대문자는 ASCII로 32 차이. 소문자 - 32 = 대문자 ('a'97 - 32 = 'A'65)."
        },
        {
          q: "문자열 복사 함수에서 마지막에 반드시 해야 하는 것은?",
          opts: ["dst를 0으로 초기화", "dst[i] = '\\0' 추가", "src를 비우기", "길이를 반환"],
          answer: 1,
          why: "복사 후 \\0을 붙이지 않으면 문자열의 끝이 없어 쓰레기 값이 붙습니다."
        },
        {
          q: '문자열 뒤집기에서 <code class="text-cyan-300">right</code>의 시작 인덱스로 올바른 것은? (길이 len)',
          opts: ["len", "len + 1", "len - 1", "0"],
          answer: 2,
          why: "마지막 글자의 인덱스는 len-1입니다. len은 \\0 자리라 잘못된 시작점입니다."
        },
        {
          q: 's[i]와 같은 의미의 포인터 표현은?',
          opts: ["*(s + i)", "*s + i", "s + *i", "&s[i]"],
          answer: 0,
          why: "s[i]는 내부적으로 *(s + i)로 처리됩니다(6차시). 인덱스는 포인터 산술의 줄임말."
        },
        {
          q: 'C에는 별도의 string 타입이 있는가?',
          opts: ["있다 (string 키워드)", "없다 — char 배열로 표현", "있다 (str 타입)", "double로 표현"],
          answer: 1,
          why: "C에는 string 타입이 없습니다. 문자열은 char 배열 + \\0로 표현합니다."
        },
        {
          q: "문자 'A'의 ASCII 코드값은?",
          opts: ["32", "48", "65", "97"],
          answer: 2,
          why: "'A'는 65, 'a'는 97, '0'은 48, 공백은 32입니다."
        },
        {
          q: '대문자 \'Z\'를 소문자 \'z\'로 바꾸려면?',
          opts: ["'Z' - 32", "'Z' + 32", "'Z' * 2", "'Z' - 1"],
          answer: 1,
          why: "대문자 + 32 = 소문자. 'Z'(90) + 32 = 'z'(122)."
        },
        {
          q: '문자 c가 숫자 문자(0~9)인지 판별하는 조건은?',
          opts: ["c >= '0' && c <= '9'", "c >= 0 && c <= 9", "c == 'num'", "c >= 'a' && c <= 'z'"],
          answer: 0,
          why: "문자 비교는 따옴표를 쓴 '0'~'9'와 비교합니다. 숫자 0~9가 아니라 문자 코드 기준."
        },
        {
          q: '문자열 "C"(글자 1개)를 담는 char 배열의 최소 크기는?',
          opts: ["1", "2", "3", "0"],
          answer: 1,
          why: "글자 1개 + \\0 = 2바이트입니다."
        },
        {
          q: '<code class="text-cyan-300">char *p = "hi"; p[0] = \'H\';</code>의 결과는?',
          opts: ["\"Hi\"로 바뀜", "크래시 위험 (읽기 전용)", "컴파일 에러", "p가 NULL"],
          answer: 1,
          why: "리터럴을 가리키는 포인터는 읽기 전용 메모리를 가리켜 수정 시 크래시할 수 있습니다."
        },
        {
          q: '\\0(null terminator)의 실제 값은?',
          opts: ["문자 '0'", "값이 0인 한 바이트", "공백", "값이 -1"],
          answer: 1,
          why: "\\0은 값이 0인 한 바이트입니다. 숫자 '0'(아스키 48)이나 공백(32)과 다릅니다."
        }
      ];

      let current = 0, score = 0;

      function startQuiz() {
        document.getElementById("intro").classList.add("hidden");
        document.getElementById("quizArea").classList.remove("hidden");
        renderQuestion();
      }

      function renderQuestion() {
        const area = document.getElementById("quizArea");
        const item = QUESTIONS[current];
        document.getElementById("progress").innerText = (current + 1) + " / " + QUESTIONS.length;
        const card = document.createElement("div");
        card.className = "bg-slate-900 rounded-3xl p-6 md:p-8 border border-slate-800";
        let html = '<div class="flex items-start gap-3 mb-5"><span class="bg-cyan-600 text-white text-sm font-black w-7 h-7 rounded-full flex items-center justify-center shrink-0">' + (current + 1) + '</span><p class="text-white text-base font-semibold">' + item.q + '</p></div>';
        html += '<div class="space-y-2">';
        item.opts.forEach(function (opt, idx) {
          html += '<button data-idx="' + idx + '" class="optBtn w-full text-left bg-slate-800/50 hover:bg-slate-800 text-slate-200 text-sm px-4 py-3 rounded-xl border border-slate-700 transition-colors"><span class="text-cyan-400 font-bold mr-2">' + String.fromCharCode(65 + idx) + '</span>' + opt + '</button>';
        });
        html += '</div><div class="feedback hidden mt-4 p-4 rounded-xl text-sm"></div>';
        html += '<div class="nextWrap hidden mt-4 text-right"><button onclick="nextQuestion()" class="bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors">' + (current === QUESTIONS.length - 1 ? "결과 보기" : "다음 문제") + '</button></div>';
        card.innerHTML = html;
        area.appendChild(card);
        card.querySelectorAll(".optBtn").forEach(function (btn) {
          btn.addEventListener("click", function () { selectAnswer(card, parseInt(btn.dataset.idx)); });
        });
        card.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function selectAnswer(card, idx) {
        const item = QUESTIONS[current];
        const btns = card.querySelectorAll(".optBtn");
        btns.forEach(function (b) { b.disabled = true; b.classList.add("cursor-default"); });
        const correct = item.answer;
        if (idx === correct) score++;
        btns[correct].className = "optBtn w-full text-left bg-emerald-600/20 text-emerald-200 text-sm px-4 py-3 rounded-xl border border-emerald-500/50";
        if (idx !== correct) {
          btns[idx].className = "optBtn w-full text-left bg-rose-600/20 text-rose-200 text-sm px-4 py-3 rounded-xl border border-rose-500/50";
        }
        const fb = card.querySelector(".feedback");
        fb.classList.remove("hidden");
        if (idx === correct) {
          fb.className = "feedback mt-4 p-4 rounded-xl text-sm bg-emerald-950/40 border border-emerald-500/30 text-emerald-200";
          fb.innerHTML = "<span class='font-bold'>정답!</span> " + item.why;
        } else {
          fb.className = "feedback mt-4 p-4 rounded-xl text-sm bg-rose-950/40 border border-rose-500/30 text-rose-200";
          fb.innerHTML = "<span class='font-bold'>오답.</span> 정답: " + String.fromCharCode(65 + correct) + ". " + item.why;
        }
        card.querySelector(".nextWrap").classList.remove("hidden");
      }

      function nextQuestion() {
        current++;
        if (current < QUESTIONS.length) renderQuestion();
        else showResult();
      }

      function showResult() {
        document.getElementById("quizArea").classList.add("hidden");
        const res = document.getElementById("result");
        res.classList.remove("hidden");
        const pct = Math.round((score / QUESTIONS.length) * 100);
        const st = document.getElementById("scoreText");
        st.innerText = score + " / " + QUESTIONS.length;
        st.className = "text-4xl font-black mb-3 " + (pct >= 70 ? "text-emerald-400" : pct >= 40 ? "text-amber-400" : "text-rose-400");
        let msg;
        if (pct === 100) msg = "완벽합니다! 문자열을 확실히 이해했네요.";
        else if (pct >= 70) msg = "잘했어요. 틀린 문항의 해설을 다시 확인하세요.";
        else if (pct >= 40) msg = "절반 정도입니다. 강의 노트를 복습하고 다시 도전하세요.";
        else msg = "복습이 필요합니다. lecture.md를 다시 읽어보세요.";
        document.getElementById("scoreMsg").innerText = msg;
        res.scrollIntoView({ behavior: "smooth" });
      }
    </script>
  </body>
</html>
