<!--
Quiz page for C Language Session 12 (문자열 함수 I).
15 multiple-choice questions, instant feedback, final score. Cyan & Amber palette.
NEITHER Mermaid JS NOR SVG were used anywhere in this output.
-->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>12차시 퀴즈: 문자열 함수 I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap");
      body { font-family: "Pretendard", sans-serif; background-color: #0f172a; color: #f8fafc; }
      pre, code { font-family: 'Courier New', Courier, monospace; }
    </style>
  </head>
  <body class="min-h-screen">
    <div class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <span class="bg-cyan-600 text-white text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">Quiz 12</span>
        <h1 class="text-sm md:text-base font-bold text-slate-200">12차시 퀴즈 — 문자열 함수 I</h1>
      </div>
      <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
        <span class="text-xs text-slate-400">진행:</span>
        <span id="progress" class="text-xs font-bold text-cyan-400">0 / 15</span>
      </div>
    </div>

    <div class="max-w-3xl mx-auto p-4 md:p-8">
      <div id="intro" class="bg-slate-900 rounded-3xl p-8 border border-slate-800 mb-6">
        <h2 class="text-2xl font-black text-white mb-2">수업 마무리 퀴즈</h2>
        <p class="text-slate-400 text-sm mb-4">문자열 함수 9개(strlen·strlcpy·strlcat·strnlen·strncpy·strncat·strcmp·strcasecmp·strncasecmp)와 버퍼 오버플로우를 점검합니다. 총 15문항. 답을 고르면 바로 정답·해설이 표시됩니다.</p>
        <button onclick="startQuiz()" class="bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors">퀴즈 시작</button>
      </div>
      <div id="quizArea" class="hidden space-y-4"></div>
      <div id="result" class="hidden bg-slate-900 rounded-3xl p-8 border border-slate-800 text-center mt-6">
        <h2 class="text-2xl font-black text-white mb-2">결과</h2>
        <p id="scoreText" class="text-4xl font-black mb-3"></p>
        <p id="scoreMsg" class="text-slate-400 text-sm mb-5"></p>
        <button onclick="location.reload()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold px-5 py-2.5 rounded-lg border border-slate-700 transition-colors">다시 풀기</button>
      </div>
    </div>

    <script>
      const QUESTIONS = [
        { q: "C에서 char 배열 a, b가 같은 내용일 때 a == b 는?", opts: ["참(내용 비교)", "거짓(서로 다른 주소를 비교)", "컴파일 에러", "항상 참"], answer: 1, why: "C엔 문자열 타입이 없어 ==는 내용이 아니라 주소를 비교합니다. 내용 비교는 strcmp가 필요합니다." },
        { q: "sbs_strlen이 세는 것은?", opts: ["\\0 포함 전체", "\\0 직전까지 글자 수", "버퍼 크기", "단어 수"], answer: 1, why: "strlen은 \\0(종결자)를 제외한 글자 수를 셉니다." },
        { q: "sbs_strlen의 반환 타입은?", opts: ["int", "size_t", "char", "void"], answer: 1, why: "길이는 음수가 없으므로 size_t를 반환합니다." },
        { q: "strcpy가 위험한 이유는?", opts: ["느려서", "dst 크기를 몰라 버퍼 오버플로우 위험", "메모리를 더 써서", "const 때문"], answer: 1, why: "strcpy는 dst 버퍼 크기를 모릅니다. src가 길면 버퍼를 넘어 덮어쓰는 보안 취약점." },
        { q: "버퍼 오버플로우를 막기 위해 strlcpy/strlcat이 받는 추가 인자는?", opts: ["src 길이", "dstsize(버퍼 크기)", "정지 문자", "복사 횟수"], answer: 1, why: "dstsize를 받아 절대 버퍼를 넘지 않습니다." },
        { q: "sbs_strlcpy의 반환값은?", opts: ["복사한 글자 수", "src의 전체 길이", "dstsize", "0"], answer: 1, why: "반환값은 src 전체 길이. dstsize보다 크면(>=) 잘렸다는 신호입니다." },
        { q: "strlcpy에서 복사 한계 조건으로 올바른 것은?", opts: ["i < dstsize", "i < dstsize - 1", "i <= dstsize", "i < srclen"], answer: 1, why: "마지막 \\0 자리를 남겨야 하므로 i < dstsize - 1까지 복사합니다." },
        { q: "sbs_strlcat의 정상 반환값은?", opts: ["srclen", "dstlen + srclen(만들려던 전체 길이)", "dstsize", "복사한 수"], answer: 1, why: "원래 만들려던 전체 길이 = 초기 dstlen + srclen." },
        { q: "sbs_strnlen이 sbs_strlen과 다른 점은?", opts: ["\\0 무시", "maxlen을 넘지 않고 멈춤", "역방향으로 셈", "size_t 대신 int 반환"], answer: 1, why: "strnlen은 maxlen에 도달하거나 \\0을 만나면 멈춰, 신뢰할 수 없는 입력에 안전합니다." },
        { q: "sbs_strncpy에서 src가 n보다 짧으면?", opts: ["남는 칸을 \\0으로 패딩", "그냥 멈춤", "공백으로 채움", "에러"], answer: 0, why: "표준 strncpy는 src가 짧으면 남은 칸을 전부 \\0으로 채웁니다." },
        { q: "sbs_strncpy의 함정은?", opts: ["항상 \\0로 끝난다", "src가 n 이상이면 \\0로 안 끝날 수 있다", "느리다", "n을 무시한다"], answer: 1, why: "src 길이가 n 이상이면 종결 \\0이 안 붙어, strlcpy와 달리 종결을 보장하지 않습니다." },
        { q: "sbs_strncat이 strncpy와 달리 항상 보장하는 것은?", opts: ["패딩", "\\0로 종결", "n글자 정확히 붙임", "dst 비우기"], answer: 1, why: "strncat은 최대 n글자를 붙이고 끝에 항상 \\0을 둡니다." },
        { q: "sbs_strcmp가 반환하는 값과 비교 방식은?", opts: ["bool, char 비교", "처음 다른 글자의 차이, unsigned char 비교", "길이 차이", "항상 0/1"], answer: 1, why: "처음 다른 글자에서 (unsigned char)차이를 반환. unsigned여야 부호가 정확합니다." },
        { q: "sbs_strcasecmp의 핵심 동작은?", opts: ["대문자로 비교", "각 글자를 소문자로 바꿔 비교(대소문자 무시)", "길이만 비교", "앞 글자만 비교"], answer: 1, why: "비교 전에 'A'~'Z'를 +32로 소문자 변환해 대소문자를 무시합니다." },
        { q: "sbs_strncasecmp와 sbs_strcasecmp의 차이는?", opts: ["부호 없음", "최대 n글자까지만 비교", "대문자 기준", "포인터 반환"], answer: 1, why: "strncasecmp는 대소문자 무시 비교에 n글자 제한을 더한 버전입니다." }
      ];

      let current = 0, score = 0;
      function startQuiz() { document.getElementById("intro").classList.add("hidden"); document.getElementById("quizArea").classList.remove("hidden"); renderQuestion(); }
      function renderQuestion() {
        const area = document.getElementById("quizArea");
        const item = QUESTIONS[current];
        document.getElementById("progress").innerText = (current + 1) + " / " + QUESTIONS.length;
        const card = document.createElement("div");
        card.className = "bg-slate-900 rounded-3xl p-6 md:p-8 border border-slate-800";
        let html = '<div class="flex items-start gap-3 mb-5"><span class="bg-cyan-600 text-white text-sm font-black w-7 h-7 rounded-full flex items-center justify-center shrink-0">' + (current + 1) + '</span><p class="text-white text-base font-semibold">' + item.q + '</p></div><div class="space-y-2">';
        item.opts.forEach(function (opt, idx) { html += '<button data-idx="' + idx + '" class="optBtn w-full text-left bg-slate-800/50 hover:bg-slate-800 text-slate-200 text-sm px-4 py-3 rounded-xl border border-slate-700 transition-colors"><span class="text-cyan-400 font-bold mr-2">' + String.fromCharCode(65 + idx) + '</span>' + opt + '</button>'; });
        html += '</div><div class="feedback hidden mt-4 p-4 rounded-xl text-sm"></div><div class="nextWrap hidden mt-4 text-right"><button onclick="nextQuestion()" class="bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-semibold px-5 py-2.5 rounded-lg transition-colors">' + (current === QUESTIONS.length - 1 ? "결과 보기" : "다음 문제") + '</button></div>';
        card.innerHTML = html;
        area.appendChild(card);
        card.querySelectorAll(".optBtn").forEach(function (btn) { btn.addEventListener("click", function () { selectAnswer(card, parseInt(btn.dataset.idx)); }); });
        card.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      function selectAnswer(card, idx) {
        const item = QUESTIONS[current];
        const btns = card.querySelectorAll(".optBtn");
        btns.forEach(function (b) { b.disabled = true; b.classList.add("cursor-default"); });
        const correct = item.answer;
        if (idx === correct) score++;
        btns[correct].className = "optBtn w-full text-left bg-emerald-600/20 text-emerald-200 text-sm px-4 py-3 rounded-xl border border-emerald-500/50";
        if (idx !== correct) btns[idx].className = "optBtn w-full text-left bg-rose-600/20 text-rose-200 text-sm px-4 py-3 rounded-xl border border-rose-500/50";
        const fb = card.querySelector(".feedback");
        fb.classList.remove("hidden");
        if (idx === correct) { fb.className = "feedback mt-4 p-4 rounded-xl text-sm bg-emerald-950/40 border border-emerald-500/30 text-emerald-200"; fb.innerHTML = "<span class='font-bold'>정답!</span> " + item.why; }
        else { fb.className = "feedback mt-4 p-4 rounded-xl text-sm bg-rose-950/40 border border-rose-500/30 text-rose-200"; fb.innerHTML = "<span class='font-bold'>오답.</span> 정답: " + String.fromCharCode(65 + correct) + ". " + item.why; }
        card.querySelector(".nextWrap").classList.remove("hidden");
      }
      function nextQuestion() { current++; if (current < QUESTIONS.length) renderQuestion(); else showResult(); }
      function showResult() {
        document.getElementById("quizArea").classList.add("hidden");
        const res = document.getElementById("result"); res.classList.remove("hidden");
        const pct = Math.round((score / QUESTIONS.length) * 100);
        const st = document.getElementById("scoreText"); st.innerText = score + " / " + QUESTIONS.length;
        st.className = "text-4xl font-black mb-3 " + (pct >= 70 ? "text-emerald-400" : pct >= 40 ? "text-amber-400" : "text-rose-400");
        let msg;
        if (pct === 100) msg = "완벽합니다! 문자열 함수 I을 확실히 이해했네요.";
        else if (pct >= 70) msg = "잘했어요. 틀린 문항의 해설을 다시 확인하세요.";
        else if (pct >= 40) msg = "절반 정도입니다. 강의 노트를 복습하고 다시 도전하세요.";
        else msg = "복습이 필요합니다. lecture.md를 다시 읽어보세요.";
        document.getElementById("scoreMsg").innerText = msg;
        res.scrollIntoView({ behavior: "smooth" });
      }
    </script>
  </body>
</html>
